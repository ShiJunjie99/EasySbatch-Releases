# M10-B2 user-space Apache reverse proxy template.
# Copy outside the repository, replace @@RUNTIME_ROOT@@, and keep that directory 0700.
# TLS private material must never be committed with this file.

ServerRoot "@@RUNTIME_ROOT@@"
PidFile "@@RUNTIME_ROOT@@/httpd.pid"
DefaultRuntimeDir "@@RUNTIME_ROOT@@"
ServerName cluster.example.edu
Listen cluster.example.edu:18443

LoadModule mpm_event_module /usr/lib64/httpd/modules/mod_mpm_event.so
LoadModule authz_core_module /usr/lib64/httpd/modules/mod_authz_core.so
LoadModule unixd_module /usr/lib64/httpd/modules/mod_unixd.so
LoadModule log_config_module /usr/lib64/httpd/modules/mod_log_config.so
LoadModule headers_module /usr/lib64/httpd/modules/mod_headers.so
LoadModule setenvif_module /usr/lib64/httpd/modules/mod_setenvif.so
LoadModule socache_shmcb_module /usr/lib64/httpd/modules/mod_socache_shmcb.so
LoadModule ssl_module /usr/lib64/httpd/modules/mod_ssl.so
LoadModule proxy_module /usr/lib64/httpd/modules/mod_proxy.so
LoadModule proxy_http_module /usr/lib64/httpd/modules/mod_proxy_http.so
SSLSessionCache "shmcb:@@RUNTIME_ROOT@@/ssl-cache(262144)"

# Keep the Alpha proxy small on the login node.
StartServers 1
ServerLimit 1
ThreadLimit 16
ThreadsPerChild 16
MinSpareThreads 1
MaxSpareThreads 16
MaxRequestWorkers 16
MaxConnectionsPerChild 10000

ErrorLog "@@RUNTIME_ROOT@@/error.log"
LogLevel warn
ServerTokens Prod
ServerSignature Off

<VirtualHost cluster.example.edu:18443>
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile "@@RUNTIME_ROOT@@/server.crt"
    SSLCertificateKeyFile "@@RUNTIME_ROOT@@/server.key"

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "18443"
    ProxyPass / http://127.0.0.1:8000/ connectiontimeout=5 timeout=60 retry=0
    ProxyPassReverse / http://127.0.0.1:8000/

    # %U excludes the query string; no request body, Cookie, or CSRF value is logged.
    LogFormat "%{%Y-%m-%dT%H:%M:%S%z}t %a %m %U %>s %D" easysbatch_safe
    CustomLog "@@RUNTIME_ROOT@@/access.log" easysbatch_safe
</VirtualHost>
