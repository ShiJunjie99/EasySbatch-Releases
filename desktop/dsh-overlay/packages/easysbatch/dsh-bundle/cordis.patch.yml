# Beta EasySbatch deliberately removes all general-purpose model tools. The
# product panels use a separate restricted Remote service for user-confirmed
# Slurm actions; the model preset exposes no shell, filesystem mutation, Web,
# skill, goal, workflow, todo, subagent, or submission tool.

- insert:
    - id: easysbatch-product
      name: '@deepseek-ai/dsh-easysbatch-product'

- id: session-telemetry-otel
  disabled: true

- id: ui-agent-preset
  disabled: true

- id: agent-presets
  config:
    default: beta-easysbatch
    roots: []
    includeShippedRoot: true
    includeUserRoot: false
