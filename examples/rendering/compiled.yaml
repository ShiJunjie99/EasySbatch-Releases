# Complete illustrative proposal for OFFLINE rendering, not a verified cluster job.
# Build directory is supplied explicitly; allocation/concurrency is out of scope.
project_dir: /shared/compiled-demo
work_dir: /shared/compiled-demo
run_type: compiled
entrypoint: ./build/solver
environment_profile: {id: example-gcc-cmake, version: "1"}
prepare_steps:
  - kind: command
    executable: cmake
    args: [-S, ., -B, build]
  - kind: command
    executable: cmake
    args: [--build, build, --parallel, "1"]
run_step:
  executable: ./build/solver
  args: [--input, inputs/case01.json]
resources:
  partition: example_cpu
  memory_mib: 4096
  time_limit_seconds: 90061
job_name: compiled-demo
required_inputs: [CMakeLists.txt, inputs/case01.json]
unresolved: []
spec_version: 1
