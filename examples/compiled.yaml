# Data-model example only. No source project or compiler is executed/provided.
project_dir: /shared/projects/compiled-demo
work_dir: /shared/projects/compiled-demo
run_type: compiled
entrypoint: /shared/projects/compiled-demo/.sbatch-agent/runs/example-001/build/solver
environment_profile:
  id: example-gcc-cmake
  version: "1"
prepare_steps:
  - kind: command
    executable: cmake
    args:
      - -S
      - /shared/projects/compiled-demo
      - -B
      - /shared/projects/compiled-demo/.sbatch-agent/runs/example-001/build
  - kind: command
    executable: cmake
    args:
      - --build
      - /shared/projects/compiled-demo/.sbatch-agent/runs/example-001/build
      - --parallel
      - "1"
run_step:
  executable: /shared/projects/compiled-demo/.sbatch-agent/runs/example-001/build/solver
  args: [--input, inputs/case01.json]
resources:
  partition: example_cpu
  nodes: 1
  ntasks: 1
  cpus_per_task: 1
  memory_mib: 4096
  time_limit_seconds: 1800
