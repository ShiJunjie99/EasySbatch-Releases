{% extends "base.html" %}
{% block content %}
<h1>作业提交</h1>
<p>选择工作目录，描述任务，检查方案后提交。</p>
<div class="actions">
  <a class="button" href="/new">新建任务</a>
  <a class="button secondary" href="/jobs">任务记录</a>

{% endblock %}
