name: publish-beta-release

on:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: read

concurrency:
  group: publish-beta-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24.18.0"
  PNPM_VERSION: "11.7.0"
  PYINSTALLER_VERSION: "6.16.0"

jobs:
  tests:
    if: github.repository == 'ShiJunjie99/EasySbatch-Releases'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python scripts/validate_beta_release_version.py "$version"
      - name: Install Python dependencies
        run: python -m pip install ".[test,web]"
      - name: Run Python tests
        run: python -m pytest -q
      - name: Verify pinned DSH preparation
        run: python scripts/prepare_beta_desktop.py

  windows-x64:
    needs: tests
    runs-on: windows-latest
    environment: production-release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install build dependencies
        run: python -m pip install ".[test]" "pyinstaller==${{ env.PYINSTALLER_VERSION }}"
      - name: Build signed Windows release
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          python scripts/build_beta_desktop.py --target win-x64 --signed --version $version 2>&1 | Tee-Object -FilePath beta-desktop-build.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            python scripts/emit_ci_build_failure.py beta-desktop-build.log --title "Signed Windows desktop build failed"
            exit $buildExitCode
          }
      - name: Verify Windows release files
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          python scripts/verify_beta_release_assets.py --target win-x64 --version $version --root dist/beta-easysbatch/win-x64
          $installer = Get-Item "dist/beta-easysbatch/win-x64/Beta-EasySbatch-$version-win-x64.exe"
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "Valid") {
            throw "Windows Authenticode verification failed: $($signature.Status) $($signature.StatusMessage)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Beta-EasySbatch-Windows-x64-signed
          path: |
            dist/beta-easysbatch/win-x64/*.exe
            dist/beta-easysbatch/win-x64/*.yml
            dist/beta-easysbatch/win-x64/*.blockmap
            dist/beta-easysbatch/win-x64/*-release.json
          if-no-files-found: error
          compression-level: 0

  macos-arm64:
    needs: tests
    runs-on: macos-15
    environment: production-release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install build dependencies
        run: python -m pip install ".[test]" "pyinstaller==${PYINSTALLER_VERSION}"
      - name: Import Developer ID certificate
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/beta-easysbatch.p12"
          keychain="$RUNNER_TEMP/beta-easysbatch-signing.keychain-db"
          notary_key="$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$notary_key"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychain -d user -s "$keychain"
          chmod 600 "$notary_key"
      - name: Build signed and notarized Apple Silicon release
        shell: bash
        env:
          DSH_DESKTOP_MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          DSH_DESKTOP_MACOS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set +e
          version="${GITHUB_REF_NAME#v}"
          python scripts/build_beta_desktop.py --target mac-arm64 --signed --version "$version" 2>&1 | tee beta-desktop-build.log
          build_exit_code=${PIPESTATUS[0]}
          set -e
          if [ "$build_exit_code" -ne 0 ]; then
            python scripts/emit_ci_build_failure.py beta-desktop-build.log --title "Signed macOS desktop build failed"
            exit "$build_exit_code"
          fi
      - name: Verify macOS release files
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          root="dist/beta-easysbatch/mac-arm64"
          image="$root/Beta-EasySbatch-$version-mac-arm64.dmg"
          python scripts/verify_beta_release_assets.py --target mac-arm64 --version "$version" --root "$root"
          codesign --verify --deep --strict --verbose=2 "$image"
          xcrun stapler validate "$image"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$image"
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/beta-easysbatch-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/beta-easysbatch.p12" "$RUNNER_TEMP"/AuthKey_*.p8
      - uses: actions/upload-artifact@v4
        with:
          name: Beta-EasySbatch-macOS-arm64-signed
          path: |
            dist/beta-easysbatch/mac-arm64/*.dmg
            dist/beta-easysbatch/mac-arm64/*.zip
            dist/beta-easysbatch/mac-arm64/*.blockmap
            dist/beta-easysbatch/mac-arm64/*.yml
            dist/beta-easysbatch/mac-arm64/*-release.json
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [windows-x64, macos-arm64]
    runs-on: ubuntu-22.04
    environment: production-release
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: Beta-EasySbatch-*-signed
          path: release-assets
          merge-multiple: true
      - name: Validate combined release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python scripts/verify_beta_release_assets.py --target combined --version "$version" --root release-assets
          (cd release-assets && sha256sum Beta-EasySbatch-* beta.yml beta-mac.yml > SHA256SUMS)
      - name: Attest released binaries
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.zip
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Beta EasySbatch $GITHUB_REF_NAME" \
            --notes-file "desktop/release-notes/${GITHUB_REF_NAME}.md" \
            --prerelease \
            --verify-tag
