name: build-beta-desktop

on:
  workflow_dispatch:
  push:
    branches:
      - "beta-desktop/**"
      - "codex/beta-easysbatch"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  # DSH uses extract-zip 2.0.1 while preparing the Windows runtime. Node
  # 24.16-24.17 has a stream regression that leaves its top-level await
  # unsettled (exit 13); 24.18 contains the upstream stream revert.
  NODE_VERSION: "24.18.0"
  PNPM_VERSION: "11.7.0"
  PYINSTALLER_VERSION: "6.16.0"

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install ".[test,web]"
      - name: Run Python tests
        run: python -m pytest -q
      - name: Verify pinned DSH preparation
        run: python scripts/prepare_beta_desktop.py

  windows-x64:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install build dependencies
        run: python -m pip install ".[test]" "pyinstaller==${{ env.PYINSTALLER_VERSION }}"
      - name: Build unsigned Windows test installer
        run: |
          python scripts/build_beta_desktop.py --target win-x64 2>&1 | Tee-Object -FilePath beta-desktop-build.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            python scripts/emit_ci_build_failure.py beta-desktop-build.log --title "Windows desktop build failed"
            exit $buildExitCode
          }
      - name: Report Windows package size
        shell: pwsh
        run: |
          python scripts/report_beta_desktop_size.py `
            --target win-x64 `
            --target-root build/beta-easysbatch/dsh/apps/desktop/.desktop-build/targets/win-x64 `
            --artifacts-root dist/beta-easysbatch/win-x64 `
            --json-out reports/beta-desktop/win-x64.json `
            --markdown-out reports/beta-desktop/win-x64.md
          Get-Content reports/beta-desktop/win-x64.md | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: Beta-EasySbatch-Windows-x64-unsigned
          path: |
            dist/beta-easysbatch/win-x64/*.exe
            dist/beta-easysbatch/win-x64/*.yml
            dist/beta-easysbatch/win-x64/*.blockmap
            dist/beta-easysbatch/win-x64/*-release.json
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Beta-EasySbatch-Windows-x64-size-report
          path: reports/beta-desktop/win-x64.*
          if-no-files-found: error

  macos-arm64:
    needs: tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install build dependencies
        run: python -m pip install ".[test]" "pyinstaller==${PYINSTALLER_VERSION}"
      - name: Build unsigned Apple Silicon test application
        run: |
          set +e
          python scripts/build_beta_desktop.py --target mac-arm64 2>&1 | tee beta-desktop-build.log
          build_exit_code=${PIPESTATUS[0]}
          set -e
          if [ "$build_exit_code" -ne 0 ]; then
            python scripts/emit_ci_build_failure.py beta-desktop-build.log --title "macOS desktop build failed"
            exit "$build_exit_code"
          fi
      - name: Report Apple Silicon package size
        run: |
          python scripts/report_beta_desktop_size.py \
            --target mac-arm64 \
            --target-root build/beta-easysbatch/dsh/apps/desktop/.desktop-build/targets/mac-arm64 \
            --artifacts-root dist/beta-easysbatch/mac-arm64 \
            --json-out reports/beta-desktop/mac-arm64.json \
            --markdown-out reports/beta-desktop/mac-arm64.md
          cat reports/beta-desktop/mac-arm64.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Beta-EasySbatch-macOS-arm64-unsigned
          path: |
            dist/beta-easysbatch/mac-arm64/*.dmg
            dist/beta-easysbatch/mac-arm64/*.zip
            dist/beta-easysbatch/mac-arm64/*.blockmap
            dist/beta-easysbatch/mac-arm64/*.yml
            dist/beta-easysbatch/mac-arm64/*-release.json
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Beta-EasySbatch-macOS-arm64-size-report
          path: reports/beta-desktop/mac-arm64.*
          if-no-files-found: error
